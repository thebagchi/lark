# Configuration for golangci-lint, pinned as a tool in go.mod.
#
# Only the settings this project's conventions actually require are here. Every
# one of them is named in .guidelines/conventions/go.md; none is a preference
# invented at this file.
version: "2"

linters:
  default: standard

  # The seven go.md lists as gates and the standard set leaves off. They ran
  # nowhere here until 2026-09-26, so a document said they were gates and no
  # command agreed - which is worse than not claiming them, because a reader
  # trusts the document.
  enable:
    - errorlint
    - funlen
    - gocognit
    - lll
    - mnd
    - nestif
    - nonamedreturns

  settings:
    staticcheck:
      # ST1000 (package comment) and ST1020 (doc comment opens with the
      # identifier) are rules go.md states, and golangci-lint leaves them off by
      # default - so they went unchecked until they were written down.
      #
      # ST1003 must stay off, and go.md records the measurement behind that: with
      # it forced on it reports every CAPITAL_SNAKE constant this project has,
      # and says nothing at all about the leading underscore it was suspected of
      # objecting to.
      checks:
        - all
        - -ST1003

    mnd:
      # UnpackPositionalArgs takes the number of positional arguments it is
      # about to fill, immediately before that many &pointers:
      #
      #   starlark.UnpackPositionalArgs(fn.Name(), args, kwargs, 2, &name, &held)
      #
      # The number is not standing in for a meaning a name could carry - it is
      # the count of the things beside it, and a reader checks it by counting
      # them. Naming it would put the answer somewhere else and leave the
      # reader unable to tell whether it was still right. Every other magic
      # number this reported was named instead: BYTE, WRAPPED, TURN.
      ignored-functions:
        - 'starlark\.UnpackPositionalArgs'

    lll:
      # 99 columns, per CLAUDE.md. A tab counts as eight, which is what the
      # limit is measured in and what go.md says.
      line-length: 99
      tab-width: 8

  exclusions:
    rules:
      # funlen asks whether a function is doing too much, and answers by
      # counting. That reads a test wrong: a table-driven test is long because
      # the table is long, and an integration test is long because the scenario
      # has phases. Splitting either to satisfy a count puts half a scenario in
      # a function nobody calls twice, which is harder to follow than the long
      # one. Product code is still held to it - cmd/lark's main was 62
      # statements and was split when this went on.
      - path: _test\.go
        linters:
          - funlen

    # strict rather than lax: lax also treats a file as generated on looser
    # hints, which lets a hand-written file leave the gate by mentioning the
    # wrong phrase in a header comment - a check that stopped looking, arriving
    # as a clean run.
    generated: strict

formatters:
  enable:
    - gofmt
    - gci

  settings:
    gci:
      # Three groups: standard library, external, this module. goimports
      # produces only two; the third needs the local prefix naming this module.
      sections:
        - standard
        - default
        - prefix(github.com/thebagchi/lark)

  exclusions:
    generated: strict
