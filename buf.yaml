version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  # Three rules this repository does not follow, by a decision taken 2026-09-19
  # and reaffirmed 2026-09-26: every .proto sits directly in proto/. A layout
  # that cleared these was tried and rejected, and clearing them now would mean
  # moving every file or renaming every fully-qualified type.
  #
  # They were accepted-and-counted rather than excepted for a week, which made
  # buf lint exit 100, which made make lint fail, which made make all fail - so
  # the one target naming every gate was the one nobody could run. A finding
  # nobody may act on is noise, and noise in a gate teaches a reader to ignore
  # the gate.
  #
  # except rather than per file, because the decision is about the layout of the
  # whole directory: a new .proto here will sit in proto/ like the others.
  except:
    - DIRECTORY_SAME_PACKAGE
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_VERSION_SUFFIX
  # Two rules, one file. They ask that an rpc's argument and result be named
  # after it - RegisterRequest and RegisterResponse for rpc Register - which is
  # right when one request is answered by one response. Register is a
  # bidirectional stream: a Request is an announcement or an answer, a Response
  # is an acceptance or a call, and nothing pairs one with one. Naming them for
  # a pairing that does not happen would describe the wrong protocol.
  #
  # Named per file rather than turned off, so a later service that does have
  # request and response pairs is still held to the convention.
  ignore_only:
    RPC_REQUEST_STANDARD_NAME:
      - proto/plugin.proto
    RPC_RESPONSE_STANDARD_NAME:
      - proto/plugin.proto
breaking:
  use:
    - FILE
